risk.21.reason=FTP transmits credentials and data in clear text. A passive network capture is enough to steal the login credentials.
risk.21.label=clear-text protocol
risk.23.reason=Telnet is a protocol with no encryption or integrity protection. All session traffic, including passwords, is transmitted in plaintext.
risk.23.label=unencrypted remote access
risk.445.reason=SMB is a frequent vector for lateral movement and ransomware propagation. Exposure to untrusted networks significantly increases the risk.
risk.445.label=lateral movement vector
risk.3389.reason=RDP is one of the most attacked services through brute force and authentication-bypass exploitation.
risk.3389.label=brute-force attack target
risk.5900.reason=VNC can be configured without authentication or with weak credentials, allowing full remote graphical access.
risk.5900.label=graphical access without authentication
risk.6379.reason=Redis has no authentication by default. An attacker with network access can read, write or delete all cached data and run scripts on the server.
risk.6379.label=in-memory database without authentication
risk.27017.reason=MongoDB is frequently deployed without authentication. An instance reachable on the network exposes all databases to read and write.
risk.27017.label=database without authentication
risk.11211.reason=Memcached has no authentication mechanism. Exposed instances can leak cached application data and be abused in amplification attacks.
risk.11211.label=cache without authentication
risk.2375.reason=Docker daemon TCP API exposed without TLS. Any client can create containers, mount the host filesystem and fully compromise the system.
risk.2375.label=container API without authentication
risk.9200.reason=Elasticsearch REST API exposed without authentication. All indexed data is accessible and the cluster can be modified by anyone with network access.
risk.9200.label=search index without authentication

