rec.cve=Update {0} to the latest stable version to fix {1} known {1,choice,1#vulnerability|1<vulnerabilities} on port {2}.
rec.telnet=Replace Telnet (port 23) with SSH for all remote access.
rec.ftp=Replace FTP (port 21) with SFTP or FTPS to protect credentials in transit.
rec.rdp=Restrict RDP access (port 3389) with firewall rules and enable Network Level Authentication (NLA).
rec.smb=Block SMB (port 445) at the perimeter. Enable SMB signing to prevent relay attacks.
rec.redis=Enable authentication in Redis (requirepass) and bind Redis to localhost or a private interface.
rec.mongodb=Enable authentication in MongoDB and restrict access to the database port by IP.
rec.docker=Immediately disable the Docker TCP API or enforce TLS client authentication.
rec.database=Restrict database port {0} ({1}) to authorized application servers only using firewall rules.
rec.updateschedule=Set a regular update schedule — prioritize services with known vulnerabilities.
rec.segmentation=Apply network segmentation to limit lateral movement between exposed services.
rec.webhigh=Review and protect the detected high-risk web paths — restrict access with authentication or firewall rules.
