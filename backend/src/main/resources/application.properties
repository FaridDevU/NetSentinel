spring.application.name=netsentinel

spring.config.import=classpath:application-risks.yml

server.port=8080

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/netsentinel
spring.datasource.username=${DB_USER:netsentinel}
spring.datasource.password=${DB_PASSWORD:netsentinel}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=netsentinel

scan.executor.core-pool-size=4
scan.executor.max-pool-size=8

sandbox.url=${SANDBOX_URL:http://127.0.0.1:7878}
sandbox.auth-token=${SANDBOX_AUTH_TOKEN:}

nvd.api.base-url=https://services.nvd.nist.gov/rest/json/cves/2.0
nvd.api.key=${NVD_API_KEY:}

netsentinel.cors.allowed-origins=${NETSENTINEL_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,null}

logging.level.com.netsentinel=INFO
