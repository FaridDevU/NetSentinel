spring.application.name=netsentinel

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/netsentinel
spring.datasource.username=${DB_USER:netsentinel}
spring.datasource.password=${DB_PASSWORD:netsentinel}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Neo4j
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:netsentinel}

# Actuator
management.endpoints.web.exposure.include=health,info

# Scan executor thread pool
scan.executor.core-pool-size=4
scan.executor.max-pool-size=8

# Nmap — uses WSL2 Kali by default; set to "windows" to use Windows nmap directly
scan.nmap.mode=${NMAP_MODE:wsl}
scan.nmap.wsl-distro=${NMAP_WSL_DISTRO:kali-linux}
scan.nmap.windows-path=${NMAP_WINDOWS_PATH:C:\Program Files (x86)\Nmap\nmap.exe}

# NVD API
nvd.api.base-url=https://services.nvd.nist.gov/rest/json/cves/2.0
nvd.api.key=${NVD_API_KEY:}
