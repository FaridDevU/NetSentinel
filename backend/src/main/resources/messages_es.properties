finding.web.high.title=Contenido web critico expuesto en {0}
finding.web.high.detail=Se encontraron {0} {0,choice,1#ruta|1<rutas} web de alto riesgo accesibles: {1}. Estas rutas pueden exponer paneles de administracion, archivos de configuracion o funciones criticas del sistema.
