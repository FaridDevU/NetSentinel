risk.21.reason=FTP transmite credenciales y datos en texto claro. Una captura pasiva de red es suficiente para robar las credenciales de acceso.
risk.21.label=protocolo en texto claro
risk.23.reason=Telnet es un protocolo sin cifrado ni proteccion de integridad. Todo el trafico de sesion, incluidas las contrasenas, se transmite en texto plano.
risk.23.label=acceso remoto sin cifrado
risk.445.reason=SMB es un vector frecuente de movimiento lateral y propagacion de ransomware. La exposicion a redes no confiables aumenta significativamente el riesgo.
risk.445.label=vector de movimiento lateral
risk.3389.reason=RDP es uno de los servicios mas atacados mediante fuerza bruta y explotacion de omisiones de autenticacion.
risk.3389.label=objetivo de ataques de fuerza bruta
risk.5900.reason=VNC puede configurarse sin autenticacion o con credenciales debiles, permitiendo acceso grafico remoto completo.
risk.5900.label=acceso grafico sin autenticacion
risk.6379.reason=Redis no tiene autenticacion por defecto. Un atacante con acceso a la red puede leer, escribir o eliminar todos los datos en cache y ejecutar scripts en el servidor.
risk.6379.label=base de datos en cache sin autenticacion
risk.27017.reason=MongoDB se despliega frecuentemente sin autenticacion. Una instancia accesible en la red expone todas las bases de datos a lectura y escritura.
risk.27017.label=base de datos sin autenticacion
risk.11211.reason=Memcached no tiene mecanismo de autenticacion. Las instancias expuestas pueden filtrar datos de la aplicacion en cache y ser explotadas en ataques de amplificacion.
risk.11211.label=cache sin autenticacion
risk.2375.reason=API TCP del daemon de Docker expuesta sin TLS. Cualquier cliente puede crear contenedores, montar el sistema de archivos del host y comprometer el sistema por completo.
risk.2375.label=API de contenedores sin autenticacion
risk.9200.reason=API REST de Elasticsearch expuesta sin autenticacion. Todos los datos indexados son accesibles y el cluster puede ser modificado por cualquier persona con acceso a la red.
risk.9200.label=indice de busqueda sin autenticacion

