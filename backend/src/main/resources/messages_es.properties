risk.sentence.critical=Se requiere accion inmediata — el riesgo de explotacion activa es alto.
risk.sentence.high=Se recomienda tomar medidas urgentes para reducir la exposicion.
risk.sentence.medium=Se aconseja aplicar los parches pendientes y restringir el acceso a los servicios expuestos.
risk.sentence.low=La exposicion es limitada. Mantener monitoreo regular y ciclos de actualizacion.
risk.sentence.info=No se requiere ninguna accion inmediata.

rec.cve=Actualiza {0} a la ultima version estable para corregir {1} {1,choice,1#vulnerabilidad conocida|1<vulnerabilidades conocidas} en el puerto {2}.
rec.telnet=Reemplaza Telnet (puerto 23) por SSH para todos los accesos remotos.
rec.ftp=Reemplaza FTP (puerto 21) por SFTP o FTPS para proteger las credenciales en transito.
rec.rdp=Restringe el acceso a RDP (puerto 3389) mediante reglas de firewall y habilita la Autenticacion de Nivel de Red (NLA).
rec.smb=Bloquea SMB (puerto 445) en el perimetro. Habilita la firma SMB para prevenir ataques de retransmision.
rec.redis=Habilita autenticacion en Redis (requirepass) y vincula Redis a localhost o a una interfaz privada.
rec.mongodb=Habilita autenticacion en MongoDB y restringe el acceso al puerto de la base de datos por IP.
rec.docker=Desactiva inmediatamente la API TCP de Docker o aplica autenticacion TLS de cliente.
rec.database=Restringe el puerto de base de datos {0} ({1}) solo a los servidores de aplicaciones autorizados mediante reglas de firewall.
rec.updateschedule=Establece un calendario regular de actualizaciones — prioriza los servicios con vulnerabilidades conocidas.
rec.segmentation=Aplica segmentacion de red para limitar el movimiento lateral entre los servicios expuestos.
rec.webhigh=Revisa y protege las rutas web de alto riesgo detectadas — restringe el acceso con autenticacion o reglas de firewall.
