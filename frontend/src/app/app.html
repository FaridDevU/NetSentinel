<div class="shell">
  <nav class="sidebar">
    <div class="sidebar-brand">
      <img src="icon.png" class="brand-icon-img" alt="NetSentinel" />
      <span class="brand-name">NetSentinel</span>
    </div>

    <ul class="nav-list">
      <li>
        <a routerLink="/scan" routerLinkActive="active" class="nav-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          {{ 'nav.newScan' | t }}
        </a>
      </li>
      <li>
        <a routerLink="/history" routerLinkActive="active" class="nav-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          {{ 'nav.history' | t }}
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      @if (offline()) {
        <div class="offline-dot" title="Backend unreachable"></div>
      }
      <span class="version">v0.1.0</span>
      <button class="lang-toggle" (click)="lang.toggle()">
        {{ lang.lang() === 'es' ? 'EN' : 'ES' }}
      </button>
    </div>
  </nav>

  <main class="content">
    @if (offline()) {
      <div class="offline-banner">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ 'offline.banner' | t }}
      </div>
    }
    <router-outlet />
  </main>
</div>
